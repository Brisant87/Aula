name: Runner Probe (self-hosted)

# Manual-only probe: proves the self-hosted runner "aula-local" can run a
# real Aula build end to end (checkout, unit-test gate, APK assembly) using
# this machine's own toolchain and the offline dependency mirror. It does
# NOT deliver an APK anywhere; the production workflow stays android.yml.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, aula-local]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Stage machine-local inputs (clips, speech engine, keystore, SDK)
        run: |
          set -e
          mkdir -p app/src/main/assets
          unzip -o -q voice_clips.zip -d app/src/main/assets
          echo "clips: $(ls app/src/main/assets/voice | wc -l)"
          mkdir -p app/libs
          cp /home/hatch/workspace/aula-native/app/libs/sherpa-onnx.aar app/libs/
          mkdir -p app/src/main/assets/asr-en
          cp /home/hatch/workspace/tools/aula-runner-stash/asr-en/* app/src/main/assets/asr-en/
          ls app/src/main/assets/asr-en/
          cp /home/hatch/workspace/tools/aula-release-debug.keystore debug.keystore
          echo "sdk.dir=/home/hatch/workspace/tools/android-sdk" > local.properties

      - name: Run the unit-test gate and build the APK (offline mirror)
        env:
          JAVA_HOME: /home/hatch/workspace/tools/jdk-17.0.21+9
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          /home/hatch/workspace/tools/gradle-9.3.1/bin/gradle :app:testDebugUnitTest :app:assembleDebug --offline -I /home/hatch/workspace/tools/mirror-init.gradle --stacktrace
          ls -la app/build/outputs/apk/debug/

      - name: Summarize test results
        if: always()
        run: |
          echo "tests:"; grep -h -o 'tests="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml || true
          echo "failures:"; grep -h -o 'failures="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml || true
          echo "errors:"; grep -h -o 'errors="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml || true
