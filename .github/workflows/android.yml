name: Build Aula APK

# Consolidated build (2026-11-09): the ONLY build path is the self-hosted
# runner "aula-local" on Pablo's machine. It uses the machine's own JDK 17,
# Gradle 9.3.1, Android SDK and the offline dependency mirror — no
# GitHub-hosted minutes, no toolchain downloads. The runner reproduces the
# old hosted builds byte-for-byte (proven by the runner probe, run #1:
# gate 52/52 and an APK checksum-identical to hosted run #97).
# Delivery is unchanged: split parts + test XMLs on the apk-delivery branch.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, aula-local]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Unpack the bundled voice clips
        run: |
          mkdir -p app/src/main/assets
          unzip -o -q voice_clips.zip -d app/src/main/assets
          ls app/src/main/assets/voice | wc -l

      - name: Stage the in-app speech engine (sherpa-onnx AAR + English model)
        run: |
          set -e
          # Machine-local copies of the exact artifacts the hosted workflow
          # used to download: the plain standalone sherpa-onnx v1.13.7 AAR
          # (arm64-only, already trimmed) from the local working tree, and
          # the four Zipformer-en int8 model files LocalAsrEngine names,
          # stashed under ~/workspace/tools/aula-runner-stash/.
          mkdir -p app/libs
          cp /home/hatch/workspace/aula-native/app/libs/sherpa-onnx.aar app/libs/
          ls -la app/libs/
          mkdir -p app/src/main/assets/asr-en
          cp /home/hatch/workspace/tools/aula-runner-stash/asr-en/* app/src/main/assets/asr-en/
          ls -la app/src/main/assets/asr-en/
          test -s app/src/main/assets/asr-en/encoder-epoch-99-avg-1-chunk-16-left-128.int8.onnx
          test -s app/src/main/assets/asr-en/tokens.txt

      - name: Point the project at the local SDK
        run: echo "sdk.dir=/home/hatch/workspace/tools/android-sdk" > local.properties

      - name: Restore the stable signing key (secret, never committed)
        env:
          AULA_KEYSTORE_B64: ${{ secrets.AULA_KEYSTORE_B64 }}
        run: |
          if [ -n "$AULA_KEYSTORE_B64" ]; then
            echo "$AULA_KEYSTORE_B64" | base64 -d > debug.keystore
            echo "stable signing key restored from secret"
          else
            echo "no keystore secret set - the next step generates an ephemeral key"
          fi

      - name: Create the debug keystore the project expects
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests (live conversation gate)
        env:
          JAVA_HOME: /home/hatch/workspace/tools/jdk-17.0.21+9
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          /home/hatch/workspace/tools/gradle-9.3.1/bin/gradle testDebugUnitTest --offline -I /home/hatch/workspace/tools/mirror-init.gradle --stacktrace

      - name: Upload unit test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

      - name: Build the debug APK
        env:
          JAVA_HOME: /home/hatch/workspace/tools/jdk-17.0.21+9
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          /home/hatch/workspace/tools/gradle-9.3.1/bin/gradle assembleDebug --offline -I /home/hatch/workspace/tools/mirror-init.gradle --stacktrace

      - name: Upload the APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aula-native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Artifact storage quota on this account is unreliable (it killed
      # run #55 after a green gate), so the APK is ALSO delivered on the
      # apk-delivery branch — the route that counts. The APK now exceeds
      # GitHub's 100 MB per-file limit (the bundled speech model), so an
      # oversized APK is published as split parts (Cognata pattern):
      # concatenate AulaNative.apk.part-* to reassemble it.
      - name: Deliver the APK on the apk-delivery branch
        run: |
          mkdir -p /tmp/delivery/test-results
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/delivery/AulaNative.apk
          cp -r app/build/test-results/testDebugUnitTest/. /tmp/delivery/test-results/ || true
          ls -la /tmp/delivery/
          git fetch origin apk-delivery || true
          if git rev-parse --verify origin/apk-delivery >/dev/null 2>&1; then
            git checkout -B apk-delivery origin/apk-delivery
          else
            git checkout --orphan apk-delivery
          fi
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p delivery/test-results
          APK_BYTES=$(stat -c%s /tmp/delivery/AulaNative.apk)
          echo "APK size: $APK_BYTES bytes"
          if [ "$APK_BYTES" -gt 95000000 ]; then
            split -b 45M /tmp/delivery/AulaNative.apk delivery/AulaNative.apk.part-
            ls -la delivery/
          else
            cp /tmp/delivery/AulaNative.apk delivery/AulaNative.apk
          fi
          cp /tmp/delivery/test-results/*.xml delivery/test-results/ 2>/dev/null || true
          git add delivery
          git -c user.email="ci@aula.local" -c user.name="Aula CI" commit -m "APK delivery for run ${{ github.run_number }}" || echo "nothing to publish"
          git push origin apk-delivery --force
