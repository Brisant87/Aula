name: Build Aula APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Unpack the bundled voice clips
        run: |
          mkdir -p app/src/main/assets
          unzip -o -q voice_clips.zip -d app/src/main/assets
          ls app/src/main/assets/voice | wc -l

      - name: Fetch the in-app speech engine (sherpa-onnx AAR + English model)
        run: |
          set -x
          # sherpa-onnx is not on Maven Central. Ask the release
          # itself what it ships and take the PLAIN standalone .aar
          # (the release also ships an RKNN variant that sorts first
          # — never take it). Same pinned version and model as
          # Cognata's engine (v1.13.7, Zipformer-en int8).
          mkdir -p /tmp/sherpa && cd /tmp/sherpa
          curl -fsSL "https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/tags/v1.13.7" -o release.json
          grep -o '"browser_download_url": *"[^"]*"' release.json | cut -d'"' -f4 > assets.txt || true
          cat assets.txt
          AAR_URL=$(grep -E '\.aar$' assets.txt | grep -v rknn | head -1 || true)
          test -n "$AAR_URL"
          echo "Using standalone AAR asset: $AAR_URL"
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          curl -fSL -o "$GITHUB_WORKSPACE/app/libs/sherpa-onnx.aar" "$AAR_URL"
          # The plain AAR bundles native libraries for FOUR ABIs but
          # the app is arm64-only (abiFilters): strip the unused ABIs
          # so the APK stays well under the delivery-branch limit.
          mkdir -p /tmp/aar-trim && cd /tmp/aar-trim
          unzip -q "$GITHUB_WORKSPACE/app/libs/sherpa-onnx.aar"
          ls jni/
          find jni -mindepth 1 -maxdepth 1 ! -name 'arm64-v8a' -exec rm -rf {} +
          ls jni/arm64-v8a/
          rm "$GITHUB_WORKSPACE/app/libs/sherpa-onnx.aar"
          zip -qr "$GITHUB_WORKSPACE/app/libs/sherpa-onnx.aar" . -x '.*'
          cd /tmp/sherpa
          unzip -l "$GITHUB_WORKSPACE/app/libs/sherpa-onnx.aar" | head -30
          ls -la "$GITHUB_WORKSPACE/app/libs/"
          # The English model (Zipformer transducer, int8): only the
          # four files LocalAsrEngine names go into assets.
          cd "$GITHUB_WORKSPACE/app/src/main/assets"
          curl -fSL -O "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-en-2023-06-26.tar.bz2"
          tar xjf sherpa-onnx-streaming-zipformer-en-2023-06-26.tar.bz2
          SRC=sherpa-onnx-streaming-zipformer-en-2023-06-26
          ls -la "$SRC"
          mkdir -p asr-en
          cp "$SRC/encoder-epoch-99-avg-1-chunk-16-left-128.int8.onnx" asr-en/
          cp "$SRC/decoder-epoch-99-avg-1-chunk-16-left-128.onnx" asr-en/
          cp "$SRC/joiner-epoch-99-avg-1-chunk-16-left-128.onnx" asr-en/
          cp "$SRC/tokens.txt" asr-en/
          rm -rf "$SRC" sherpa-onnx-streaming-zipformer-en-2023-06-26.tar.bz2
          ls -la asr-en/
          test -s asr-en/encoder-epoch-99-avg-1-chunk-16-left-128.int8.onnx
          test -s asr-en/tokens.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android platform and build tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Point the project at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Create the debug keystore the project expects
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests (live conversation gate)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 9.3.1
          arguments: testDebugUnitTest --stacktrace

      - name: Upload unit test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

      - name: Build the debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 9.3.1
          arguments: assembleDebug --stacktrace

      - name: Upload the APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aula-native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Artifact storage quota on this account is unreliable (it killed
      # run #55 after a green gate), so the APK is ALSO delivered as a
      # file on the apk-delivery branch — the route that counts.
      - name: Deliver the APK on the apk-delivery branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/AulaNative.apk
          git fetch origin apk-delivery || true
          if git rev-parse --verify origin/apk-delivery >/dev/null 2>&1; then
            git checkout -B apk-delivery origin/apk-delivery
          else
            git checkout --orphan apk-delivery
          fi
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/AulaNative.apk AulaNative.apk
          git add AulaNative.apk
          git -c user.email="ci@aula.local" -c user.name="Aula CI" commit -m "Deliver APK from run ${{ github.run_number }}" || echo "no change"
          git push origin apk-delivery --force
