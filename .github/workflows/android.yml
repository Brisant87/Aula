name: Build Aula APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Unpack the bundled voice clips
        run: |
          mkdir -p app/src/main/assets
          unzip -o -q voice_clips.zip -d app/src/main/assets
          ls app/src/main/assets/voice | wc -l

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android platform and build tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Point the project at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Create the debug keystore the project expects
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests (live conversation gate)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 9.3.1
          arguments: testDebugUnitTest --stacktrace

      - name: Upload unit test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

      - name: Build the debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 9.3.1
          arguments: assembleDebug --stacktrace

      - name: Upload the APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: aula-native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Artifact storage quota on this account is unreliable (it killed
      # run #55 after a green gate), so the APK is ALSO delivered as a
      # file on the apk-delivery branch — the route that counts.
      - name: Deliver the APK on the apk-delivery branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/AulaNative.apk
          git fetch origin apk-delivery || true
          if git rev-parse --verify origin/apk-delivery >/dev/null 2>&1; then
            git checkout -B apk-delivery origin/apk-delivery
          else
            git checkout --orphan apk-delivery
          fi
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/AulaNative.apk AulaNative.apk
          git add AulaNative.apk
          git -c user.email="ci@aula.local" -c user.name="Aula CI" commit -m "Deliver APK from run ${{ github.run_number }}" || echo "no change"
          git push origin apk-delivery --force
